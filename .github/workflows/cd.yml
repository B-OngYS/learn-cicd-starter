name: cd

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.0"
      - name: Install goose        uses: mscno/setup-goose@v1
        run: go install github.com/pressly/goose/v3/cmd/goose@latest
      - name: Build app
        run: ./scripts/buildprod.sh

      - name: auth
        uses: google-github-actions/auth@v2
        with:
            credentials_json: ${{ secrets.GCP_CREDENTIALS}}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Build and push image
        run: gcloud builds submit --tag us-central1-docker.pkg.dev/notely-499303/notely-ar-repo/notely-app:latest .

      - name: Run migrations
        run: ./scripts/migrateup.sh

      - name: Deploy to Cloud Run       
        run: gcloud run deploy notely --image us-central1-docker.pkg.dev/notely-499303/notely-ar-repo/notely-app:latest --region us-central1 --allow-unauthenticated --project notely-499303 --max-instances=4
